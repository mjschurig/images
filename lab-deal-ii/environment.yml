name: dealii-dev
channels:
  - conda-forge
  - defaults
dependencies:
  # Python and core packages
  - python=3.9
  - pip

  # Scientific computing stack
  - numpy
  - scipy
  - matplotlib
  - sympy
  - pandas
  - seaborn

  # Jupyter ecosystem
  - jupyterlab
  - jupyter
  - ipywidgets
  - ipympl # Interactive matplotlib

  # C++ kernel support
  - xeus-cling
  - xtensor
  - xtensor-blas

  # Development tools (compilers installed via apt for better compatibility)
  - cmake
  - make

  # Additional scientific packages
  - h5py
  - netcdf4
  - vtk

  # Visualization
  - pyvista
  - mayavi

  # Additional pip packages
  - pip:
      - meshio
      - gmsh
      - pylablib
